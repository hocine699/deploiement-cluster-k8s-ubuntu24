---
- name: "Post-installation - Vérification du cluster"
  hosts: control_plane
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: "Attente de l'agent Cilium sur tous les nœuds"
      command: kubectl -n kube-system rollout status daemonset/cilium --timeout=300s
      changed_when: false

    - name: "Attente de l'opérateur Cilium et de Hubble"
      command: kubectl -n kube-system rollout status deployment/{{ item }} --timeout=300s
      loop:
        - cilium-operator
        - hubble-relay
        - hubble-ui
      changed_when: false

    - name: "Attente que tous les nœuds soient Ready"
      shell: kubectl get nodes --no-headers | awk '$2 == "Ready"' | wc -l
      register: ready_nodes_count
      until: ready_nodes_count.stdout|int >= (groups['control_plane'] + groups['workers']) | length
      retries: 20
      delay: 15
      changed_when: false

    - name: "Vérification que kube-proxy est bien absent"
      command: kubectl -n kube-system get daemonset kube-proxy
      register: kube_proxy_check
      failed_when: kube_proxy_check.rc == 0
      changed_when: false

    - name: "Vérification que Cilium a créé la GatewayClass"
      command: kubectl get gatewayclass cilium
      register: gatewayclass_check
      until: gatewayclass_check.rc == 0
      retries: 10
      delay: 10
      changed_when: false

    - name: "État final des nœuds"
      command: kubectl get nodes -o wide
      register: final_nodes_status
      changed_when: false

    - name: "État final des pods système"
      command: kubectl get pods -n kube-system -o wide
      register: final_system_pods
      changed_when: false

    - name: "Résultats finaux"
      debug:
        msg: |
          === NŒUDS ===
          {{ final_nodes_status.stdout }}

          === PODS SYSTÈME ===
          {{ final_system_pods.stdout }}

          === GATEWAYCLASS ===
          {{ gatewayclass_check.stdout }}
