---
- name: "Préparation de tous les nœuds"
  hosts: all
  become: true
  gather_facts: true
  
  pre_tasks:
    - name: "Mise à jour du cache APT"
      apt:
        update_cache: yes
        cache_valid_time: 3600

  roles:
    - common
    - containerd
    - kubernetes

- name: "Initialisation du nœud master"
  hosts: control_plane
  become: true
  roles:
    - master

- name: "Attente que le master soit complètement prêt"
  hosts: control_plane
  become: true
  tasks:
    - name: "Vérification que le master est Ready"
      shell: kubectl get nodes --no-headers | grep "Ready"
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: master_ready
      until: master_ready.rc == 0
      retries: 5
      delay: 10
      failed_when: false

    - name: "Vérification que Cilium est opérationnel"
      shell: kubectl -n kube-system get pods -l k8s-app=cilium --no-headers | grep -c Running
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: cilium_running
      until: cilium_running.stdout|int >= 1
      retries: 5
      delay: 10
      failed_when: false

    - name: "Affichage de l'état du control plane avant déploiement workers"
      debug:
        msg: |
          Control plane Ready: {{ master_ready.rc == 0 }}
          Pods Cilium Running: {{ cilium_running.stdout | default('Unknown') }}
          Prêt pour déploiement workers

- name: "Déploiement des workers"
  hosts: workers
  become: true
  roles:
    - worker

- import_playbook: post-install.yml

- name: "Vérification finale du cluster"
  hosts: all
  become: true
  roles:
    - verification
  run_once: true
