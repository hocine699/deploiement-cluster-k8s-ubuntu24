---
- name: "Nettoyage total du cluster Kubernetes"
  hosts: all
  become: true
  gather_facts: true

  vars:
    kube_runtime_dirs:
      - /var/lib/kubelet
      - /var/lib/etcd
      - /etc/kubernetes
      - /etc/cni/net.d
      - /opt/cni/bin
      - /var/lib/containerd
      - /run/flannel
      - /run/calico
    kube_user_dirs:
      - /root/.kube
      - /home/{{ ansible_user_id }}/.kube
    kube_apt_files:
      - /etc/apt/sources.list.d/kubernetes.list
      - /etc/apt/keyrings/kubernetes-apt-keyring.gpg

  tasks:

    - name: "Reset Kubernetes via kubeadm"
      command: kubeadm reset -f
      ignore_errors: true

    - name: "Arrêt des services Kubernetes"
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - kubelet
        - containerd
      ignore_errors: true

    - name: "Déverrouillage des paquets Kubernetes"
      dpkg_selections:
        name: "{{ item }}"
        selection: install
      loop:
        - kubelet
        - kubeadm
        - kubectl
      ignore_errors: true

    - name: "Désinstallation des paquets Kubernetes"
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: absent
        purge: yes

    - name: "Suppression des fichiers et dossiers Kubernetes"
      file:
        path: "{{ item }}"
        state: absent
      loop: "{{ kube_runtime_dirs + kube_user_dirs }}"

    - name: "Suppression des interfaces réseau CNI"
      shell: |
        for iface in flannel.1 cni0 docker0; do
          ip link delete $iface 2>/dev/null || true
        done

    - name: "Vidage des règles iptables"
      shell: |
        iptables -F
        iptables -t nat -F
        iptables -t mangle -F
        iptables -X
        ip6tables -F
        ip6tables -t nat -F
        ip6tables -t mangle -F
        ip6tables -X

    - name: "Suppression du dépôt Kubernetes APT"
      file:
        path: "{{ item }}"
        state: absent
      loop: "{{ kube_apt_files }}"

    - name: "Mise à jour complète des paquets Ubuntu"
      apt:
        update_cache: yes
        upgrade: full
        autoremove: yes
        autoclean: yes

    - name: "Redémarrage de containerd"
      systemd:
        name: containerd
        state: restarted
        enabled: yes

    - name: "Reboot des nœuds"
      reboot:
        reboot_timeout: 300
        msg: "Reboot post-cleanup et mise à jour Ubuntu"

    - name: "Vérification post-nettoyage"
      shell: systemctl is-active kubelet || echo "kubelet arrêté (normal)"
      register: cleanup_status
      ignore_errors: true

    - name: "Statut post-nettoyage"
      debug:
        var: cleanup_status.stdout
