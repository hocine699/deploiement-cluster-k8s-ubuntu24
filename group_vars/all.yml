# Variables pour le cluster Kubernetes
kubernetes_version: "1.35.0"
kubernetes_version_rhel_package: "1.35.0.*"
# Suffixe pkgs.k8s.io pour paquets Debian (format: -1.1, ex: kubelet=1.35.0-1.1)
kubernetes_package_suffix: "-1.1"

kubernetes_version_full: "{{ kubernetes_version }}{{ kubernetes_package_suffix }}"
kubernetes_version_series: "{{ kubernetes_version.split('.')[:2] | join('.') }}"

# Version du dépôt pkgs.k8s.io — doit correspondre au minor de kubernetes_version
k8s_pkgs_version: "v1.35"

# Configuration réseau
pod_network_cidr: "10.244.0.0/16"
service_network_cidr: "10.96.0.0/12"

# CNI Plugin (Flannel)
flannel_version: "v0.28.4"

# Docker/Containerd
containerd_version: "1.7.28-0ubuntu1~24.04.1"

# Configuration du cluster
cluster_name: "k8s-cluster"
api_server_endpoint: "{{ hostvars[groups['masters'][0]]['ansible_host'] }}"
api_server_port: 6443

# Certificats
cert_dir: "/etc/kubernetes/pki"
kubeconfig_dir: "/etc/kubernetes"

# Configuration système
swap_disabled: true
firewall_disabled: true

# Packages à installer
common_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - software-properties-common

# Configuration des modules kernel
kernel_modules:
  - br_netfilter
  - overlay

# Configuration sysctl
sysctl_config:
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1
  net.ipv4.ip_forward: 1
